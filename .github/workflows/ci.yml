name: CI
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.21', '1.22']
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}.x
          cache: true
          cache-dependency-path: go.sum
      - run: go version
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-go-${{ matrix.go }}
          path: coverage.out
          if-no-files-found: error
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
